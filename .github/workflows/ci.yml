name: CI

# Los nueve checks bloqueantes de Phase 0 (Execution Plan §4).
#
# `main` está protegida: no se empuja a ella. Este pipeline corre sobre las ramas de
# fase, sobre las ramas de milestone —el First Product Slice usa `milestone/**`— y sobre
# los PR hacia `main`, y su verde es condición para el merge.
#
# EC-020 · «Fase completa solo con gates ejecutables en verde».

on:
  push:
    branches: ['phase/**', 'milestone/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Valores locales de Supabase. La clave anónima y la de servicio de una instancia
  # local son constantes públicas del CLI, no secretos: no otorgan acceso a ningún
  # dato real. Ningún secreto de staging o producción entra en este pipeline.
  #
  # `SUPABASE_DB_URL` NO va aquí: solo la define el job `database`, que es el único
  # con una base de datos delante. Definida a nivel de workflow, la guarda
  # schema-drift entraba en su nivel B dentro del job estático —sin base ni Docker—
  # y un test de `operational-bypasses.spec` agotaba su límite esperando al diff.
  NEXT_PUBLIC_ENVIRONMENT: local
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321

jobs:
  # ---------------------------------------------------------------------------
  # Checks que no necesitan base de datos.
  # ---------------------------------------------------------------------------
  static:
    name: Estático · typecheck, lint, unit, guardas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: typecheck
        run: npm run typecheck

      - name: lint
        run: npm run lint

      - name: format
        run: npm run format

      # `guards` ya incluye client-authority-guard: no se repite como paso aparte.
      - name: guardas de invariante
        run: npm run guards

      # secret-scan construye por sí mismo, inyectando un centinela como valor de
      # las variables de servidor, y comprueba que no aparece ni en los artefactos
      # de cliente ni en la salida renderizada. No depende de un build anterior.
      - name: secret-scan
        run: npm run secret-scan
        env:
          NEXT_PUBLIC_SUPABASE_ANON_KEY: anon-placeholder-para-escaneo

      - name: test:unit
        run: npm run test:unit
        env:
          NEXT_PUBLIC_SUPABASE_ANON_KEY: anon-placeholder-para-escaneo

      - name: Instalar navegadores de Playwright
        run: npx playwright install --with-deps chromium

      # Los E2E estáticos (arranque, PWA, accesibilidad) no tocan Supabase: se
      # ejecutan aquí, sin base de datos.
      - name: test:e2e:static
        run: npm run test:e2e:static
        env:
          NEXT_PUBLIC_SUPABASE_ANON_KEY: anon-placeholder-para-escaneo

  # ---------------------------------------------------------------------------
  # Checks contra una instancia real de Supabase.
  # ---------------------------------------------------------------------------
  database:
    name: Base de datos · migraciones, integración, RLS, E2E
    runs-on: ubuntu-latest
    env:
      # Solo aquí hay base de datos. Credencial pública por defecto del stack local
      # del CLI, sobre loopback: no es un secreto.
      SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # El CLI de Supabase NO se instala con `supabase/setup-cli@v1 · version: latest`:
      # una herramienta que decide el esquema no puede cambiar de versión sola. Viene
      # del lockfile como devDependency con versión exacta, igual que en local.
      - run: npm ci

      - name: Levantar Supabase local (CLI fijado por el lockfile)
        run: npm run db:start

      - name: Publicar claves locales en el entorno del job
        run: |
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(npm run --silent db:status -- --output json | jq -r '.ANON_KEY')" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$(npm run --silent db:status -- --output json | jq -r '.SERVICE_ROLE_KEY')" >> "$GITHUB_ENV"

      - name: Aplicar migraciones desde cero
        env:
          # `db:reset` es destructivo: la guarda de tools/db.mjs exige que el entorno
          # lo admita y, fuera de local, una autorización explícita.
          NEXT_PUBLIC_ENVIRONMENT: local
        run: npm run db:reset

      - name: schema-drift
        run: npm run schema-drift

      # Reversibilidad real (Phase 1A · P1A-G10): se revierten las migraciones posteriores a
      # Phase 0 con sus scripts down, se comprueba que el catálogo queda limpio y se vuelven
      # a aplicar desde cero. La deriva se vuelve a medir después.
      - name: db:roundtrip
        env:
          NEXT_PUBLIC_ENVIRONMENT: local
        run: npm run db:roundtrip

      - name: schema-drift · tras el roundtrip
        run: npm run schema-drift

      - name: test:integration
        run: npm run test:integration

      - name: test:rls
        run: npm run test:rls

      - name: Instalar navegadores de Playwright
        run: npx playwright install --with-deps chromium

      # Los estáticos ya corrieron en el job anterior; aquí van los de auth, que sí
      # necesitan Supabase y exigen credenciales de limpieza.
      - name: test:e2e:auth
        run: npm run test:e2e:auth

      - name: Publicar informe de E2E
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Detener Supabase
        if: always()
        run: npm run db:stop

  # ---------------------------------------------------------------------------
  # Deriva de esquema contra STAGING (P0-G4 · EC-011 · REQ-A04)
  #
  # El job `database` comprueba la deriva contra el stack local recién migrado.
  # Este job la comprueba contra el proyecto STUDY_OS_STAGING real: `supabase db
  # diff` construye una base sombra desde las migraciones del repositorio (Docker,
  # que el runner sí tiene) y la compara con el esquema `public` de STAGING. Si
  # STAGING tuviera algo que las migraciones no describen, el diff no es vacío y
  # el job falla.
  #
  # La cadena de conexión es el secreto `STAGING_DB_URL` del repositorio (pooler
  # en modo sesión, sin datos reales). Nunca se imprime. Antes de usarla se
  # comprueba que apunta al ref de STAGING y no al de PRODUCTION: una URL
  # equivocada falla cerrado, no ejecuta nada.
  # ---------------------------------------------------------------------------
  drift-staging:
    name: Deriva de esquema · STUDY_OS_STAGING (real)
    runs-on: ubuntu-latest
    env:
      STAGING_REF: xzcrqsolxarutlvvkzfp
      PRODUCTION_REF: nzcgufeycvehczroryoe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: La cadena apunta a STAGING y nunca a PRODUCTION (fail-closed, sin imprimirla)
        env:
          SUPABASE_DB_URL: ${{ secrets.STAGING_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::STAGING_DB_URL no está configurado como secreto del repositorio"; exit 1
          fi
          case "$SUPABASE_DB_URL" in
            *"$PRODUCTION_REF"*) echo "::error::la cadena apunta a PRODUCTION: se rechaza"; exit 1 ;;
          esac
          case "$SUPABASE_DB_URL" in
            *"$STAGING_REF"*) echo "la cadena contiene el ref de STAGING ($STAGING_REF)" ;;
            *) echo "::error::la cadena no contiene el ref de STAGING"; exit 1 ;;
          esac

      - name: schema-drift · contra STUDY_OS_STAGING
        env:
          SUPABASE_DB_URL: ${{ secrets.STAGING_DB_URL }}
        run: npm run schema-drift
